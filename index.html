<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BalloonRush</title>
<style>
@font-face{ font-family:'Fredoka'; font-weight:400 500; font-style:normal; src:url('fonts/Poppins-Medium.ttf') format('truetype'); }
@font-face{ font-family:'Fredoka'; font-weight:600 800; font-style:normal; src:url('fonts/Poppins-Bold.ttf') format('truetype'); }
</style>
<style>
:root{
  --sky-top:#1b1245; --sky-mid:#3b1f6e; --sky-low:#0f6b7a;
  --ink:#fff6e8; --ink-dim:rgba(255,246,232,.72);
  --panel:rgba(20,12,52,.93); --accent:#ffd23f; --accent-shadow:#c28f00;
  box-sizing:border-box;
  padding-top:var(--safe-area-inset-top, env(safe-area-inset-top,0px));
  padding-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#fff6e8; --ink-dim:rgba(255,246,232,.72);
    --panel:rgba(20,12,52,.93); --accent:#ffd23f; --accent-shadow:#c28f00;
  }
}
:root[data-theme="dark"]{
  --ink:#fff6e8; --ink-dim:rgba(255,246,232,.72);
  --panel:rgba(20,12,52,.93); --accent:#ffd23f; --accent-shadow:#c28f00;
}
html{ scroll-padding-top:var(--safe-area-inset-top, env(safe-area-inset-top,0px)); }
html,body{
  height:100%; margin:0; overflow:hidden;
  background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  color:var(--ink);
  font-family:'Fredoka','Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }

#hud{
  position:fixed; left:0; right:0; top:0; z-index:5; transform:translateZ(0); contain:layout style;
  padding:calc(var(--safe-area-inset-top, env(safe-area-inset-top,0px)) + 10px) 16px 22px;
  display:flex; justify-content:space-between; align-items:flex-start;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(14,8,40,.6), rgba(14,8,40,0));
}
#score{ min-width:96px; font-size:42px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
#score.neg{ color:#ff8a9b; }
#best{ font-size:13px; color:var(--ink-dim); margin-top:3px; }
#combo{ width:84px; text-align:center; opacity:0; transform:translateY(-4px); transition:opacity .15s, transform .15s; }
#combo.on{ opacity:1; transform:none; }
#mx{ font-size:34px; font-weight:700; line-height:1; color:var(--accent); }
#streak{ font-size:13px; color:var(--ink-dim); }
#bar{ width:64px; height:5px; border-radius:3px; background:rgba(255,255,255,.2); margin:4px auto 0; overflow:hidden; }
#bar i{ display:block; height:100%; width:100%; background:var(--accent); transform-origin:left center; transform:scaleX(0); }
#right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
#lives{ font-size:28px; letter-spacing:2px; line-height:1; }
.h{ color:#ff4d6d; }
.h.off{ color:rgba(255,255,255,.22); }
#btns{ display:flex; gap:8px; }
#snd,#mus,#pause{
  position:relative; pointer-events:auto; background:rgba(255,255,255,.14); border:0; border-radius:999px;
  width:38px; height:38px; color:var(--ink); font-size:18px; cursor:pointer;
}
#pause{ display:none; }
#pause.show{ display:block; }
#mus.off{ opacity:.55; }
#mus.off::after{ content:""; position:absolute; left:9px; right:9px; top:50%; height:2px; background:#fff; transform:rotate(-40deg); }
#fps{
  position:fixed; right:10px; bottom:calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px)) + 8px); z-index:5;
  font-size:11px; color:rgba(255,255,255,.45); pointer-events:none;
}

#overlay{
  position:fixed; inset:0; z-index:4; display:flex; align-items:center; justify-content:center;
  padding:calc(var(--safe-area-inset-top, env(safe-area-inset-top,0px)) + 16px) 16px calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px)) + 16px);
  box-sizing:border-box;
}
#overlay.hidden{ display:none; }
.panel{
  width:min(100%,380px); box-sizing:border-box; padding:24px 22px 26px; text-align:center;
  background:var(--panel); border:1px solid rgba(255,255,255,.14); border-radius:26px;
  max-height:100%; overflow-y:auto; touch-action:pan-y;
}
.panel.off{ display:none; }
.panel h1{ margin:0 0 6px; font-size:44px; line-height:1.15; font-weight:700; }
.panel p{ margin:0 0 14px; color:var(--ink-dim); font-size:17px; }
#rules{ list-style:none; margin:0 0 20px; padding:0; text-align:start; }
#rules li{ position:relative; padding-inline-start:30px; margin:0 0 10px; font-size:16px; line-height:1.4; }
#rules li::before{
  content:""; position:absolute; inset-inline-start:2px; top:3px; width:16px; height:19px; border-radius:50%;
  background:var(--c,#ff4d6d);
}
.row{ margin:0 0 20px; text-align:start; }
.row .lbl{ display:block; font-size:14px; color:var(--ink-dim); margin:0 0 6px; }
.seg{ display:flex; gap:6px; }
.seg button{
  flex:1; font-family:inherit; font-size:15px; font-weight:600; color:var(--ink);
  background:rgba(255,255,255,.12); border:0; border-radius:999px; padding:9px 4px; cursor:pointer;
}
.seg button.on{ background:var(--accent); color:#2a1650; }
.hint{ margin-top:6px; font-size:13px; color:var(--ink-dim); min-height:17px; }
.swatches{ display:flex; flex-wrap:wrap; gap:10px; }
.sw{
  width:46px; height:46px; border-radius:50%; border:3px solid rgba(255,255,255,.25); cursor:pointer; padding:0;
}
.sw.on{ border-color:#fff; box-shadow:0 0 0 2px var(--accent); }
button:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
.big{
  font-family:inherit; font-size:22px; font-weight:700; color:#2a1650; background:var(--accent);
  border:0; border-radius:999px; padding:12px 38px; cursor:pointer;
  box-shadow:0 6px 0 var(--accent-shadow);
}
.big:active{ transform:translateY(3px); box-shadow:0 3px 0 var(--accent-shadow); }
.ghost{
  display:block; margin:14px auto 0; font-family:inherit; font-size:22px; font-weight:700; color:var(--ink);
  background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); border-radius:999px; padding:10px 38px; cursor:pointer;
}
.stack .ghost{ width:100%; margin:0; }
.stack .big{ display:block; width:100%; margin:0 0 12px; }
.langbtn{
  display:block; width:100%; margin:0 0 12px; font-family:inherit; font-size:24px; font-weight:700;
  color:var(--ink); background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.2);
  border-radius:20px; padding:14px 0; cursor:pointer;
}
.langbtn:active{ background:var(--accent); color:#2a1650; }
.langtitle{ font-size:30px !important; }
.langgrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.langgrid .langbtn{ margin:0; font-size:18px; padding:12px 4px; line-height:1.2; }
.wrapseg{ flex-wrap:wrap; }
.wrapseg button{ flex:1 1 calc(33.333% - 6px); padding:9px 2px; font-size:14px; }

/* ödüllü reklam ekranı */
#adScreen{
  position:fixed; inset:0; z-index:12; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:24px; box-sizing:border-box; text-align:center;
  background:linear-gradient(to bottom,#0c0a1f,#1b1245);
}
#adScreen.hidden{ display:none; }
#adTag{ font-size:14px; color:var(--ink-dim); border:1px solid rgba(255,255,255,.3); border-radius:6px; padding:2px 10px; }
#adCount{ font-size:104px; font-weight:700; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums; }
#adBarWrap{ width:min(80%,320px); height:8px; border-radius:4px; background:rgba(255,255,255,.2); overflow:hidden; }
#adBar{ height:100%; width:100%; background:var(--accent); transform-origin:left center; transform:scaleX(0); transition:transform 1s linear; }
#adHint{ max-width:320px; font-size:16px; line-height:1.4; color:var(--ink-dim); }
#adClose{
  position:absolute; top:calc(var(--safe-area-inset-top, env(safe-area-inset-top,0px)) + 12px); inset-inline-end:14px;
  margin:0; padding:8px 18px; font-size:15px;
}

/* giriş ekranı */
#splash{
  position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  text-align:center; transition:opacity .45s ease; direction:ltr;
}
#splash.out{ opacity:0; pointer-events:none; }
#splash.gone{ display:none; }
.cluster{ position:relative; width:150px; height:120px; margin-bottom:26px; }
.sb{
  position:absolute; display:block; border-radius:50% 50% 48% 48%;
  animation:rise 1.3s cubic-bezier(.2,.8,.25,1) both;
}
.sb::after{ content:""; position:absolute; left:50%; top:100%; width:1.5px; height:30px; background:rgba(255,255,255,.5); }
.sb1{ left:4px; top:24px; width:52px; height:62px; animation-delay:.05s;
  background:radial-gradient(circle at 35% 30%, #ffc2cd, #ff4d6d 55%, #b8123f); }
.sb2{ left:46px; top:0; width:58px; height:70px; animation-delay:.2s;
  background:radial-gradient(circle at 35% 30%, #c4e5ff, #3da5ff 55%, #1262b8); }
.sb3{ left:94px; top:30px; width:52px; height:62px; animation-delay:.35s;
  background:radial-gradient(circle at 35% 30%, #fff3b0, #ffd23f 55%, #cf8f00); }
@keyframes rise{ from{ transform:translateY(240px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
.wm{ font-size:48px; font-weight:700; line-height:1.05; animation:fade .6s ease 1.1s both; }
.gm{ margin-top:8px; font-size:24px; font-weight:600; color:var(--accent); animation:fade .6s ease 1.7s both; }
.founder{
  position:absolute; left:16px; bottom:calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px)) + 14px);
  max-width:calc(100% - 32px); text-align:left;
  font-size:min(36px, 9.5vw); line-height:1.15; color:var(--ink-dim); animation:fade .6s ease 2s both;
}
@media (prefers-reduced-motion: reduce){
  .sb,.wm,.gm,.founder{ animation:none; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="best">Rekor 0</div>
  </div>
  <div id="combo">
    <div id="mx">x1</div>
    <div id="streak">seri 0</div>
    <div id="bar"><i></i></div>
  </div>
  <div id="right">
    <div id="lives"></div>
    <div id="btns">
      <button id="pause" aria-label="Duraklat">⏸</button>
      <button id="mus" aria-label="Müziği aç veya kapat">🎵</button>
      <button id="snd" aria-label="Efekt seslerini aç veya kapat">🔊</button>
    </div>
  </div>
</div>
<div id="fps" aria-hidden="true"></div>

<div id="overlay" class="hidden">
  <!-- dil seçimi (yalnızca ilk açılışta) -->
  <div class="panel off" id="pLang">
    <h1 class="langtitle">Dil · Language · اللغة</h1>
    <p>&nbsp;</p>
    <div class="langgrid" id="langlist"></div>
  </div>

  <!-- ana menü / oyun bitti -->
  <div class="panel off" id="pMenu">
    <h1 id="ttl">BalloonRush</h1>
    <p id="sub"></p>
    <ul id="rules">
      <li style="--c:#3da5ff" id="r1"></li>
      <li style="--c:#3b3350" id="r2"></li>
      <li style="--c:#ff4d6d" id="r3"></li>
      <li style="--c:#ffd23f" id="r4"></li>
    </ul>
    <button class="big" id="go"></button>
    <button class="ghost" id="openSet"></button>
  </div>

  <!-- devam et? (reklam izle) -->
  <div class="panel off stack" id="pRevive">
    <h1 id="reviveTitle" style="font-size:34px"></h1>
    <p id="reviveSub"></p>
    <button class="big" id="watchAd"></button>
    <button class="ghost" id="noRevive"></button>
  </div>

  <!-- duraklatıldı -->
  <div class="panel off stack" id="pPause">
    <h1 id="pauseTitle"></h1>
    <p>&nbsp;</p>
    <button class="big" id="resume"></button>
    <button class="big" id="restart"></button>
    <button class="ghost" id="openSet2"></button>
  </div>

  <!-- ayarlar -->
  <div class="panel off" id="pSet">
    <h1 id="setTitle"></h1>
    <p>&nbsp;</p>
    <div class="row">
      <span class="lbl" id="lblLang"></span>
      <div class="seg wrapseg" id="langseg" role="group"></div>
    </div>
    <div class="row">
      <span class="lbl" id="lblGfx"></span>
      <div class="seg" id="gfxseg" role="group">
        <button data-q="0" id="gq0"></button>
        <button data-q="1" id="gq1"></button>
        <button data-q="2" id="gq2"></button>
      </div>
      <div class="hint" id="gfxhint"></div>
    </div>
    <div class="row">
      <span class="lbl" id="lblBg"></span>
      <div class="swatches" id="bgseg" role="group"></div>
    </div>
    <button class="big" id="back"></button>
  </div>
</div>

<div id="adScreen" class="hidden">
  <button class="ghost" id="adClose"></button>
  <div id="adTag"></div>
  <div id="adCount">30</div>
  <div id="adBarWrap"><div id="adBar"></div></div>
  <div id="adHint"></div>
  <button class="big" id="adContinue" style="display:none"></button>
</div>

<div id="splash">
  <div class="cluster" aria-hidden="true"><i class="sb sb1"></i><i class="sb sb2"></i><i class="sb sb3"></i></div>
  <div class="wm">EX2Console</div>
  <div class="gm">BalloonRush</div>
  <div class="founder">founder:<br>Arif Yıldırım</div>
</div>

  function floatText(x, y, s, color, size, life, vy) {
    if (texts.length > 14) texts.shift();
    texts.push({ x, y, s, color, size:size||24, life:life||0.8, ml:life||0.8, vy:vy||-60 });
  }
  function banner(s, color) { floatText(W / 2, H * 0.36, s, color || '#ffd23f', 46, 1.0, -36); }
  function colorsOf(b) {
    if (b.c >= 0) return [COL[b.c].m, COL[b.c].l, '#ffffff'];
    return RAINBOW;
  }

  /* ---------- oyun mantığı ---------- */
  function spawn(decor, avoid, tight) {
    const r = baseR * (0.85 + Math.random() * 0.3);
    const margin = r + 8;
    const gap = r * 2 + baseR * (tight ? 0.3 : 1.2);
    let x, tries = 0;
    do {
      x = margin + Math.random() * Math.max(1, W - margin * 2);
      tries++;
    } while (avoid && avoid.some(ax => Math.abs(x - ax) < gap) && tries < 60);
    let type = 'normal';
    if (!decor) {
      const pR = time > 15 ? 0.018 : 0;
      const pB = time > 10 ? Math.min(0.22, 0.06 + (time - 10) * 0.004) : 0;
      const pG = time > 14 ? Math.min(0.28, 0.06 + (time - 14) * 0.005) : 0;
      const pS = time > 24 ? Math.min(0.12, 0.04 + (time - 24) * 0.002) : 0;
      const roll = Math.random();
      if (roll < pR) type = 'rainbow';
      else if (roll < pR + pB) type = 'bomb';
      else if (roll < pR + pB + pG) type = 'grow';
      else if (roll < pR + pB + pG + pS) type = 'stone';
    }
    const base = decor ? H * 0.23 : H * 0.23 + Math.min(time, 120) * H * 0.00165;
    const sp = base * (0.88 + Math.random() * 0.28);
    const c = (type === 'rainbow' || type === 'bomb') ? -1 : (Math.random() * 3) | 0;
    const nb = {
      x, y:H + r + 30 + (avoid ? Math.random() * 90 : 0), r:type === 'grow' ? r * 0.75 : r, baseR:r, type, c,
      vy:-sp, ph:Math.random() * 6.28, sw:18 + Math.random() * 16,
      hp:type === 'stone' ? 2 : 1, hitT:0, dead:false, locked:false
    };
    balloons.push(nb);
    return nb;
  }

  function addStreak() {
    const before = mult();
    streak++;
    const after = mult();
    if (after > before) { banner('x' + after + '!', '#ffd23f'); flash = Math.max(flash, 0.18); }
  }
  function award(b, base) {
    const gain = base * mult();
    score += gain;
    floatText(b.x, b.y - b.r, '+' + gain, b.c >= 0 ? COL[b.c].l : '#ffffff', 20 + mult() * 2.5, 0.8, -70);
    updateHud();
  }
  function chainPop(o) {
    if (o.dead) return;
    o.dead = true;
    addStreak();
    burst(o.x, o.y, colorsOf(o), 14, 300);
    ring(o.x, o.y, o.r * 2, COL[o.c].l, 0.35);
    award(o, 10);
    popSound(streak);
  }
  function loseLife(kind) {
    lives--; streak = 0; lastColor = -1;
    shake = kind === 'bomb' ? 20 : 14; flash = 0.45;
    vib(kind === 'bomb' ? [40, 30, 60] : [60]);
    updateHud();
    if (lives <= 0) gameOver('lives');
  }

  function hit(b) {
    if (b.type === 'bomb') {
      b.dead = true;
      burst(b.x, b.y, ['#ff6b4a', '#ffb347', '#3b3350', '#ffffff'], 32, 420);
      ring(b.x, b.y, b.r * 4, '#ff6b4a', 0.5);
      bombSound();
      floatText(b.x, b.y - b.r, LL().bomb, '#ff9a85', 30, 0.9, -50);
      loseLife('bomb');
      return;
    }
    if (b.type === 'stone' && b.hp > 1) {
      b.hp = 1; b.hitT = 0.15;
      burst(b.x, b.y, ['#d6dcef', '#9aa2b8', '#ffffff'], 10, 240);
      clinkSound();
      return;
    }
    if (b.type === 'rainbow') {
      b.dead = true;
      const counts = [0, 0, 0];
      balloons.forEach(o => { if (!o.dead && !o.locked && (o.type === 'normal' || o.type === 'grow')) counts[o.c]++; });
      const mx = Math.max(counts[0], counts[1], counts[2]);
      const ci = mx === 0 ? (Math.random() * 3) | 0 : counts.indexOf(mx);
      burst(b.x, b.y, RAINBOW, 26, 380);
      ring(b.x, b.y, Math.max(W, H) * 0.5, COL[ci].m, 0.6);
      rainbowSound();
      lastColor = ci;
      addStreak();
      award(b, 40);
      const targets = balloons.filter(o => !o.dead && !o.locked && o.c === ci && (o.type === 'normal' || o.type === 'grow'));
      targets.forEach((o, i) => {
        o.locked = true;
        delayed.push({ t:0.08 * (i + 1), fn:() => chainPop(o) });
      });
      return;
    }
    b.dead = true;
    if (streak === 0 || b.c === lastColor) addStreak(); else { streak = 1; }
    lastColor = b.c;
    burst(b.x, b.y, colorsOf(b), 16, 320);
    ring(b.x, b.y, b.r * 2.2, COL[b.c].l, 0.35);
    award(b, b.type === 'stone' ? 30 : b.type === 'grow' ? 25 : 10);
    popSound(streak);
  }

  function tap(x, y) {
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      if (b.dead || b.locked) continue;
      const dx = (x - b.x) / (b.r + 10), dy = (y - b.y) / (b.r * 1.18 + 10);
      if (dx * dx + dy * dy <= 1) { hit(b); return; }
    }
    if (streak >= 3) floatText(x, y - 20, LL().broken, '#ffffff', 18, 0.7, -40);
    streak = 0; lastColor = -1;
    ring(x, y, 26, '#ffffff', 0.25);
    missSound();
    updateHud();
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    if (ac && ac.state === 'suspended' && !gamePaused) ac.resume();
    if (state !== 'play' || gamePaused) return;
    tap(e.clientX, e.clientY);
  });

  function startGame() {
    initAudio();
    gamePaused = false;
    if (ac && ac.state === 'suspended') ac.resume();
    startMusic();
    score = 0; lives = 3; streak = 0; lastColor = -1; time = 0; wind = 0; windHigh = false;
    balloons = []; parts = []; rings = []; texts = []; delayed = [];
    spawnTimer = 0.3; shake = 0; flash = 0; overInfo = null; reviveUsed = false;
    state = 'play';
    hideOverlay();
    updatePauseBtn();
    updateHud(); flushHud();
  }
  function gameOver(reason) {
    if (state !== 'play') return;
    state = 'over';
    const record = score > best;
    if (record) { best = score; try { localStorage.setItem('balon-best', String(best)); } catch (e) {} }
    const byScore = reason === 'score';
    if (byScore) { shake = 16; flash = 0.4; vib([60, 40, 90]); lossSound(); }
    overInfo = { byScore, score, record, best };
    renderMenu();
    updatePauseBtn();
    setTimeout(() => {
      if (state !== 'over') return;
      if (!reviveUsed && adAvailable()) { showPanel('pRevive'); }
      else { renderMenu(); showPanel('pMenu'); }
    }, 700);
    updateHud(); flushHud();
  }

  /* ---------- ödüllü reklam: reklam izle, devam et ---------- */
  // 'simulate': geliştirme/test için 30 sn'lik sahte reklam ekranı gösterir ("Reklam (test)" yazar).
  // Gerçek reklam için uygulamada window.BalloonRushAds.showRewarded() tanımlanır
  // (ödül kazanılırsa true döndüren bir Promise). Tanımlıysa test ekranı yerine o çağrılır.
  const AD_MODE = 'off';
  const AD_SECONDS = 30;
  function adAvailable() {
    return !!(window.BalloonRushAds && window.BalloonRushAds.showRewarded) || AD_MODE === 'simulate';
  }
  function showRewardedAd() {
    if (window.BalloonRushAds && window.BalloonRushAds.showRewarded) {
      return Promise.resolve(window.BalloonRushAds.showRewarded()).then(r => !!r, () => false);
    }
    return simulateAd();
  }
  function simulateAd() {
    return new Promise(resolve => {
      const scr = $('adScreen'), cnt = $('adCount'), bar = $('adBar'), cont = $('adContinue'), close = $('adClose');
      let left = AD_SECONDS, iv = null;
      function finish(ok) {
        clearInterval(iv);
        cont.onclick = null; close.onclick = null;
        scr.classList.add('hidden');
        if (ac && !gamePaused && !document.hidden) ac.resume();
        resolve(ok);
      }
      cnt.textContent = ltr(left);
      bar.style.transform = 'scaleX(0)';
      cont.style.display = 'none'; close.style.display = '';
      $('adHint').textContent = LL().adHint;
      scr.classList.remove('hidden');
      if (ac) ac.suspend();
      iv = setInterval(() => {
        if (document.hidden) return; // sekme arka plandayken süre işlemez
        left--;
        cnt.textContent = ltr(Math.max(0, left));
        bar.style.transform = 'scaleX(' + ((AD_SECONDS - left) / AD_SECONDS) + ')';
        if (left <= 0) {
          clearInterval(iv);
          $('adHint').textContent = LL().adDone;
          close.style.display = 'none';
          cont.style.display = '';
        }
      }, 1000);
      cont.onclick = () => finish(true);
      close.onclick = () => finish(false);
    });
  }
  function reviveGame() {
    reviveUsed = true;
    lives = 3; if (score < 0) score = 0;
    streak = 0; lastColor = -1;
    balloons.length = 0; parts.length = 0; rings.length = 0; texts.length = 0; delayed.length = 0;
    spawnTimer = 1.2; shake = 0; flash = 0; overInfo = null;
    state = 'play'; gamePaused = false;
    hideOverlay();
    updatePauseBtn();
    updateHud(); flushHud();
    if (ac && !document.hidden) ac.resume();
  }
  $('watchAd').addEventListener('click', () => {
    showRewardedAd().then(ok => {
      if (ok) reviveGame(); else { renderMenu(); showPanel('pMenu'); }
    });
  });
  $('noRevive').addEventListener('click', () => { renderMenu(); showPanel('pMenu'); });

  /* ---------- duraklatma ---------- */
  function pauseGame() {
    if (state !== 'play' || gamePaused) return;
    gamePaused = true;
    if (ac) ac.suspend();
    updatePauseBtn();
    showPanel('pPause');
  }
  function resumeGame() {
    if (!gamePaused) return;
    gamePaused = false;
    last = performance.now(); acc = 0;
    hideOverlay();
    updatePauseBtn();
    if (ac && !document.hidden) ac.resume();
  }
  $('pause').addEventListener('click', pauseGame);
  $('resume').addEventListener('click', resumeGame);
  $('restart').addEventListener('click', startGame);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (gamePaused) resumeGame(); else pauseGame(); }
  });

  $('go').addEventListener('click', startGame);
  $('snd').addEventListener('click', () => {
    muted = !muted;
    $('snd').textContent = muted ? '🔇' : '🔊';
  });
  $('mus').classList.toggle('off', !musicOn);
  $('mus').addEventListener('click', () => {
    musicOn = !musicOn;
    try { localStorage.setItem('balon-music', musicOn ? 'on' : 'off'); } catch (e) {}
    $('mus').classList.toggle('off', !musicOn);
    if (musicOn) {
      initAudio();
      if (ac && ac.state === 'suspended' && !gamePaused) ac.resume();
      if (state !== 'ready') startMusic();
    } else {
      stopMusic();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state === 'play') pauseGame(); else if (ac) ac.suspend();
    } else if (ac && !gamePaused) {
      ac.resume();
    }
  });

  /* ---------- güncelleme ---------- */
  function step(dt) {
    tAll += dt;
    for (const k of bokeh) { k.y -= k.sp * dt; if (k.y < -k.r) { k.y = H + k.r; k.x = Math.random() * W; } }
    for (let i = delayed.length - 1; i >= 0; i--) {
      const d = delayed[i]; d.t -= dt;
      if (d.t <= 0) { delayed.splice(i, 1); d.fn(); }
    }
    const playing = state === 'play';
    if (playing) time += dt;

    let wt = 0;
    if (playing && time > 20) {
      const w = Math.sin(time * 0.35);
      wt = Math.sign(w) * Math.max(0, Math.abs(w) - 0.35) / 0.65;
    }
    wind += (wt - wind) * Math.min(1, dt * 2);
    const high = Math.abs(wind) > 0.3;
    if (high && !windHigh && playing) banner(wind > 0 ? LL().windR : LL().windL, '#bfeaff');
    windHigh = high;

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (playing) {
        let n = 2;
        if (time > 60) n = 4;
        else if (time > 35 && Math.random() < 0.5) n = 3;
        const xs = [];
        for (let i = 0; i < n; i++) {
          const nb = spawn(false, xs.length ? xs : null, n >= 4);
          xs.push(nb.x);
        }
        spawnTimer = Math.max(0.5, 1.15 - time * 0.006) * (0.75 + Math.random() * 0.5) * (n >= 4 ? 1.25 : 1);
      } else {
        spawn(true);
        spawnTimer = 0.55 + Math.random() * 0.5;
      }
    }

    const windVx = wind * 120;
    for (let i = 0; i < balloons.length; i++) {
      const b = balloons[i];
      b.y += b.vy * dt;
      b.x += (Math.sin(tAll * 1.6 + b.ph) * b.sw + windVx) * dt;
      if (b.x < b.r) b.x = b.r;
      if (b.x > W - b.r) b.x = W - b.r;
      if (b.hitT > 0) b.hitT -= dt;
      if (b.type === 'grow') {
        const p = Math.max(0, Math.min(1, 1 - (b.y - topLine) / (H - topLine)));
        b.r = b.baseR * (0.75 + p * 0.55);
        if (playing && !b.dead && b.y - b.r * 1.18 <= topLine) {
          b.dead = true;
          burst(b.x, b.y, colorsOf(b), 28, 360);
          ring(b.x, b.y, b.r * 3, '#ffffff', 0.45);
          lossSound();
          floatText(b.x, Math.max(b.y + 30, topLine + 40), LL().top, '#ffffff', 26, 0.9, -20);
          loseLife('grow');
        }
      }
      if (playing && !b.dead && b.type === 'normal' && b.y - b.r * 1.18 <= topLine) {
        b.dead = true;
        score -= 100;
        burst(b.x, b.y, ['#9aa2b8', '#d6dcef', '#ffffff'], 8, 160);
        floatText(b.x, topLine + 34, '-100', '#ff8a9b', 30, 0.9, -30);
        missSound();
        updateHud();
        if (score <= -100) gameOver('score');
      }
      if (b.y < -b.r * 3) b.dead = true;
    }

    // dikenli balona değen balonlar patlar
    for (let i = 0; i < balloons.length; i++) {
      const bm = balloons[i];
      if (bm.type !== 'bomb' || bm.dead) continue;
      for (let j = 0; j < balloons.length; j++) {
        const o = balloons[j];
        if (o === bm || o.dead || o.type === 'bomb') continue;
        const dx = o.x - bm.x, dy = o.y - bm.y, rr = (o.r + bm.r) * 0.95;
        if (dx * dx + dy * dy < rr * rr) {
          o.dead = true;
          burst(o.x, o.y, colorsOf(o).concat(['#ff6b4a']), 12, 280);
          ring(o.x, o.y, o.r * 2, '#ff6b4a', 0.3);
          popSound(0);
        }
      }
    }
    compact(balloons, alive);

    for (let i = 0; i < parts.length; i++) { const p = parts[i]; p.life -= dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    compact(parts, lifeOk);
    for (let i = 0; i < rings.length; i++) { const r = rings[i]; r.life -= dt; r.r = 4 + (r.max - 4) * (1 - r.life / r.ml); }
    compact(rings, lifeOk);
    for (let i = 0; i < texts.length; i++) { const t = texts[i]; t.life -= dt; t.y += t.vy * dt; }
    compact(texts, lifeOk);

    shake *= Math.exp(-dt * 7);
    if (shake < 0.2) shake = 0;
    flash = Math.max(0, flash - dt * 1.4);

    if (Math.abs(wind) > 0.02) {
      for (const l of windLines) {
        l.x += wind * 700 * l.k * dt;
        if (l.x > W + l.len) l.x = -l.len;
        if (l.x < -l.len) l.x = W + l.len;
      }
    }
  }

  /* ---------- çizim ---------- */
  function drawBalloon(b) {
    const r = b.r, ry = r * 1.18;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.sin(tAll * 1.6 + b.ph) * 0.07);
    if (b.hitT > 0) { const sc = 1 + 0.18 * (b.hitT / 0.15); ctx.scale(sc, sc); }

    const s = Math.sin(tAll * 4 + b.ph) * 7;
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, ry + 7); ctx.quadraticCurveTo(s, ry + r * 0.8, -s * 0.6, ry + r * 1.6); ctx.stroke();

    if (QC.glow && curMult >= 2 && b.type !== 'bomb') {
      const gk = r / 40;
      ctx.drawImage(glowSprite(b.c), -80 * gk, -80 * gk, 160 * gk, 160 * gk);
    }
    if (b.type === 'bomb') {
      const sp = getSpikes(r), ks = r / sp.r;
      ctx.save(); ctx.rotate(tAll * 0.5);
      ctx.drawImage(sp.c, -sp.cx * ks, -sp.cy * ks, sp.w * ks, sp.h * ks);
      ctx.restore();
    }
    const bs = getBody(b), k = r / bs.r;
    ctx.drawImage(bs.c, -bs.cx * k, -bs.cy * k, bs.w * k, bs.h * k);

    if (b.type === 'bomb') {
      const pulse = 0.5 + 0.5 * Math.sin(tAll * 8 + b.ph);
      ctx.strokeStyle = 'rgba(255,90,60,' + (0.4 + pulse * 0.5) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.98, ry * 0.98, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (b.type === 'rainbow') {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(tAll * 7)) + ')'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(0, 0, r + 3, ry + 3, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (b.type === 'grow') {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.3 * Math.sin(tAll * 6 + b.ph)) + ')'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, 0, r + 5, ry + 5, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H); // gökyüzü CSS ile çiziliyor

    curMult = state === 'play' ? mult() : 1;
    if (QC.neon && curMult >= 2) {
      const sp = getNeon();
      const a = (curMult >= 4 ? 0.2 : 0.1) + 0.06 * Math.sin(tAll * 6);
      const hp = ((tAll * 60) % 360) / 60, i0 = Math.floor(hp) % 6, f = hp - Math.floor(hp);
      const R = H * 0.85;
      ctx.globalAlpha = a * (1 - f); ctx.drawImage(sp[i0], W / 2 - R, H - R, R * 2, R * 2);
      ctx.globalAlpha = a * f; ctx.drawImage(sp[(i0 + 1) % 6], W / 2 - R, H - R, R * 2, R * 2);
      ctx.globalAlpha = 1;
    }

    if (QC.bokeh) {
      for (let i = 0; i < bokeh.length; i++) {
        const k = bokeh[i];
        ctx.fillStyle = k.fs;
        ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 7); ctx.fill();
      }
    }

    const wa = Math.abs(wind);
    if (wa > 0.05) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 * wa) + ')'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (const l of windLines) { ctx.moveTo(l.x, l.y); ctx.lineTo(l.x - Math.sign(wind) * l.len * l.k, l.y); }
      ctx.stroke();
    }

    ctx.save();
    if (shake > 0) {
      const sk = shake * QC.shake * (RM ? 0.3 : 1);
      ctx.translate((Math.random() - .5) * sk, (Math.random() - .5) * sk);
    }

    if (state === 'play') {
      ctx.setLineDash([6, 10]); ctx.strokeStyle = 'rgba(255,255,255,.26)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, topLine); ctx.lineTo(W, topLine); ctx.stroke();
      ctx.setLineDash([]);
      const lb = getLabel();
      const lsc = Math.min(1, (W - 16) / lb.w), lw = lb.w * lsc, lh = lb.h * lsc;
      ctx.drawImage(lb.c, LL().dir === 'rtl' ? W - lw - 8 : 8, topLine + 6, lw, lh);
    }

    for (let i = 0; i < balloons.length; i++) drawBalloon(balloons[i]);

    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      ctx.globalAlpha = Math.max(0, r.life / r.ml);
      ctx.strokeStyle = r.c; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (parts.length) {
      for (let k = 0; k < PAL.length; k++) {
        ctx.fillStyle = PAL[k];
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (p.k !== k) continue;
          ctx.globalAlpha = Math.min(1, p.life * 2);
          ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
        }
      }
      ctx.globalAlpha = 1;
    }

    for (let i = 0; i < texts.length; i++) {
      const t = texts[i], sp = textSprite(t.s, t.color, t.size);
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life / t.ml * 1.6));
      ctx.drawImage(sp.c, t.x - sp.w / 2, t.y - sp.h / 2, sp.w, sp.h);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,90,90,' + Math.min(0.4, flash * 0.5) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---------- giriş ekranı ---------- */
  let paused = true, splashDone = false;
  const splashT0 = performance.now();
  function dismissSplash() {
    if (splashDone) return;
    splashDone = true;
    const sp = $('splash');
    sp.classList.add('out');
    setTimeout(() => { sp.classList.add('gone'); }, 500);
    paused = false;
    // dil daha önce seçildiyse bir daha sorulmaz
    showPanel(langChosen ? 'pMenu' : 'pLang');
  }
  $('splash').addEventListener('click', () => {
    if (performance.now() - splashT0 > 600) dismissSplash();
  });
  setTimeout(dismissSplash, 3600);

  /* ---------- döngü: 60 fps sınırı + otomatik kalite ayarı ---------- */
  let last = performance.now(), acc = 0, lastDraw = last, ema = 16.7, slowCount = 0, drawn = 0, fpsT = last, fpsN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused || gamePaused) { last = now; lastDraw = now; fpsT = now; acc = 0; return; }
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += dt;
    if (acc < 0.0145) return; // 120 Hz ekranlarda her ikinci kareyi atla
    const stepDt = Math.min(acc, 0.05);
    acc = 0;
    step(stepDt);
    draw();
    flushHud();

    fpsN++;
    if (now - fpsT >= 500) {
      elFps.textContent = state === 'play' ? Math.round(fpsN * 1000 / (now - fpsT)) + ' fps · ' + LL().gfx[quality] : '';
      fpsT = now; fpsN = 0;
    }

    const dd = Math.min(now - lastDraw, 60);
    lastDraw = now;
    ema = ema * 0.92 + dd * 0.08;
    drawn++;
    // kullanıcı kendisi seçmediyse, yavaşlarsa kaliteyi otomatik düşür
    if (!userChose && drawn > 120 && ema > 24 && quality > 0) {
      slowCount++;
      if (slowCount > 45) {
        slowCount = 0; ema = 16.7;
        setQuality(quality - 1, false);
        banner(LL().gfxBanner + ': ' + LL().gfx[quality], '#bfeaff');
      }
    } else {
      slowCount = 0;
    }
  }
  buildLangButtons();
  buildSwatches();
  applyBg(bgIndex, false);
  applyLang();
  updateHud(); flushHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
